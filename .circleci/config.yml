version: 2.1

jobs:
  build-and-publish:
    docker:
      - image: cimg/node:25.2.1
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build project
          command: npm run build
      - run:
          name: Publish to NPM
          command: |
            npm set //registry.npmjs.org/:_authToken=$NPM_TOKEN
            npm publish

workflows:
  version: 2
  build-and-publish-workflow:
    jobs:
      - build-and-publish:
          filters:
            tags:
              only: /^v[0-9]+(\.[0-9]+)*$/